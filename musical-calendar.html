<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 音乐剧排期 & 抢票日历</title>
<style>
  :root{
    --bg:#12101e; --bg2:#0e0c18; --panel:#1b1730; --panel2:#221d3d;
    --border:#332c55; --text:#ece9f7; --muted:#a49fc4; --dim:#6f6a92;
    --accent:#f2b24c; --accent2:#ffd98a;
    --pri3:#ff6b6b; --pri2:#ffa94d; --pri1:#6c9eff;
    --ok:#51cf66; --warn:#ffd43b; --info:#4dabf7; --danger:#ff6b6b;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
    color:var(--text); font-size:14px; line-height:1.55;
    min-height:100vh;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#3a3360;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  header{
    position:sticky;top:0;z-index:50;
    background:rgba(18,16,30,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .head-inner{max-width:1160px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-size:19px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
  .brand .sub{font-size:12px;color:var(--dim);font-weight:400;margin-left:8px}
  nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  .tab{
    padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--muted);
    border:1px solid transparent;user-select:none;font-size:14px;transition:.15s;
  }
  .tab:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .tab.active{color:#1a1428;background:var(--accent);font-weight:600}
  .tab .cnt{font-size:11px;opacity:.75;margin-left:3px}

  #banner{display:none;max-width:1160px;margin:8px auto 0;padding:9px 16px;border-radius:10px;
    background:rgba(242,178,76,.14);border:1px solid rgba(242,178,76,.5);color:var(--accent2);
    cursor:pointer;font-size:13.5px}
  main{max-width:1160px;margin:0 auto;padding:18px;padding-bottom:60px}
  section.view{display:none}
  section.view.active{display:block;animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .card h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .card h2 .hint{font-size:12px;color:var(--dim);font-weight:400}
  .muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12px}

  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;
    border:1px solid var(--border);background:var(--panel2);color:var(--text);
    cursor:pointer;font-size:13.5px;transition:.15s;user-select:none;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent2)}
  .btn.primary{background:var(--accent);color:#1a1428;border-color:var(--accent);font-weight:600}
  .btn.primary:hover{filter:brightness(1.08);color:#1a1428}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger)}
  .btn.sm{padding:3px 9px;font-size:12.5px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---- 日历 ---- */
  .cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .cal-title{font-size:19px;font-weight:700;min-width:150px}
  .cal-stats{font-size:12.5px;color:var(--muted)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{text-align:center;color:var(--dim);font-size:12px;padding:4px 0}
  .dow.weekend{color:var(--pri2)}
  .day-cell{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    min-height:104px;padding:6px;cursor:pointer;transition:.12s;overflow:hidden;
  }
  .day-cell:hover{border-color:var(--accent);transform:translateY(-1px)}
  .day-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .day-cell.other{opacity:.35}
  .day-num{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}
  .day-cell.today .day-num{color:var(--accent);font-weight:700}
  .chip{
    display:flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.25;
    padding:2px 6px;border-radius:6px;margin-bottom:3px;border:1px solid transparent;
    overflow:hidden;white-space:nowrap;
  }
  .chip .t{flex:1;overflow:hidden;text-overflow:ellipsis}
  .chip.pri-3{background:rgba(255,107,107,.16);color:#ffb3b3;border-color:rgba(255,107,107,.35)}
  .chip.pri-2{background:rgba(255,169,77,.14);color:#ffd0a0;border-color:rgba(255,169,77,.35)}
  .chip.pri-1{background:rgba(108,158,255,.13);color:#bcd4ff;border-color:rgba(108,158,255,.3)}
  .chip.warn{box-shadow:0 0 0 1px var(--danger) inset}
  .chip.bought{opacity:.75}
  .chip.bought::after{content:"✓";color:var(--ok)}
  .chip .ct{font-size:10.5px;opacity:.85}
  .day-cell .more{font-size:11px;color:var(--dim);text-align:center}

  /* ---- 列表 ---- */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=text],input[type=date],input[type=time],input[type=datetime-local],select,textarea{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:6px 9px;font-size:13.5px;font-family:inherit;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  select option{background:var(--panel2)}
  textarea{resize:vertical;min-height:60px;width:100%}

  .show-card .sc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px dashed var(--border);margin-bottom:10px}
  .sc-name{font-size:16px;font-weight:700}
  .pill{font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  .pill.p3{color:var(--pri3);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1)}
  .pill.p2{color:var(--pri2);border-color:rgba(255,169,77,.4);background:rgba(255,169,77,.1)}
  .pill.p1{color:var(--pri1);border-color:rgba(108,158,255,.4);background:rgba(108,158,255,.1)}
  .pill.ok{color:var(--ok);border-color:rgba(81,207,102,.4)}
  .sc-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
  table.ptab{width:100%;border-collapse:collapse}
  table.ptab th{font-size:12px;color:var(--dim);text-align:left;padding:5px 8px;border-bottom:1px solid var(--border)}
  table.ptab td{padding:7px 8px;border-bottom:1px solid rgba(51,44,85,.5);vertical-align:middle}
  table.ptab tr:hover td{background:rgba(255,255,255,.02)}
  .warn-ico{color:var(--warn);cursor:help;font-size:13px}
  .ok-ico{color:var(--ok)}

  /* ---- 抢票 ---- */
  .tick-row{display:flex;align-items:center;gap:14px;padding:11px 14px;border:1px solid var(--border);
    border-radius:10px;margin-bottom:8px;background:var(--panel);flex-wrap:wrap}
  .tick-row.open-soon{border-color:var(--warn);background:rgba(255,212,59,.07)}
  .tick-row.past{opacity:.5}
  .tick-count{font-variant-numeric:tabular-nums;min-width:150px;text-align:center;
    background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:6px 10px;font-size:15px;font-weight:600}
  .tick-count.hot{color:var(--warn);border-color:var(--warn)}
  .tick-count.zero{color:var(--danger);border-color:var(--danger)}
  .tick-info{flex:1;min-width:220px}
  .tick-info .t1{font-size:15px;font-weight:600}
  .tick-info .t2{font-size:12.5px;color:var(--muted)}

  /* ---- 排期结果 ---- */
  .opt-grid{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .opt{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
  .opt input{accent-color:var(--accent);width:15px;height:15px}
  .result-sum{font-size:15px;margin-bottom:12px;padding:12px 14px;border-radius:10px;
    background:rgba(81,207,102,.1);border:1px solid rgba(81,207,102,.4)}
  .res-day{border-left:3px solid var(--accent);padding-left:12px;margin:14px 0}
  .res-day .rd{font-weight:700;font-size:14.5px;margin-bottom:6px}
  .res-item{display:flex;gap:10px;align-items:center;padding:7px 10px;background:var(--panel2);
    border:1px solid var(--border);border-radius:9px;margin-bottom:6px;flex-wrap:wrap}
  .res-item .rt{font-variant-numeric:tabular-nums;font-weight:600;min-width:96px}
  .double{color:var(--accent2);font-size:12px}
  .skip-item{padding:6px 2px;border-bottom:1px dashed var(--border);font-size:13.5px}
  .skip-item .why{color:var(--dim);font-size:12.5px}
  .conf-item{font-size:13px;padding:4px 0;color:#ffb3b3}
  .conf-item.work{color:#ffd0a0}

  /* ---- 设置 ---- */
  .set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .wh-days{display:flex;gap:6px;flex-wrap:wrap}
  .wh-days label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text);cursor:pointer;
    border:1px solid var(--border);padding:4px 10px;border-radius:8px;margin:0}
  .wh-days input{accent-color:var(--accent)}
  .wh-days label.on{background:rgba(242,178,76,.12);border-color:var(--accent);color:var(--accent2)}

  /* ---- 空状态 & 提示 ---- */
  .empty{text-align:center;padding:50px 20px;color:var(--dim)}
  .empty .big{font-size:44px;margin-bottom:12px}
  .empty p{margin-bottom:16px}
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);
    background:#2d2650;border:1px solid var(--accent);color:var(--accent2);
    padding:10px 20px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:.25s;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- 弹窗 ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(6,5,12,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:720px;width:100%;
    max-height:88vh;overflow:auto;padding:22px;animation:fadein .16s ease}
  .modal h3{font-size:17px;margin-bottom:14px}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .day-item{border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-bottom:9px;background:var(--panel2)}
  .day-item .di-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .day-item .di-time{font-weight:700;font-size:15px}
  .day-item .di-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .day-item .di-conf{font-size:12.5px;color:#ffb3b3;margin-top:4px}
  .day-item .di-acts{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .day-item .di-acts select{margin-right:auto}

  .today-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
  .today-strip .lb{font-size:12.5px;color:var(--dim)}
  .tag-wd{font-size:11px;color:var(--dim);border:1px solid var(--border);padding:1px 7px;border-radius:20px}
  .tag-wd.work{color:var(--pri2);border-color:rgba(255,169,77,.4)}
  .tag-wd.free{color:var(--ok);border-color:rgba(81,207,102,.4)}
  h4.sub-title{font-size:13px;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
  @media (max-width:760px){
    .cal-grid{gap:4px}
    .day-cell{min-height:70px;padding:4px}
    .day-num{font-size:11px}
    .chip{font-size:10px;padding:1px 4px}
    .head-inner{gap:8px}
  }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="brand">🎭 音乐剧排期 · 抢票日历<span class="sub">看剧不撞期 · 抢票不错过</span></div>
    <nav class="tabs" id="tabs">
      <div class="tab active" data-act="tab" data-tab="cal">📅 日历</div>
      <div class="tab" data-act="tab" data-tab="list">📋 剧目</div>
      <div class="tab" data-act="tab" data-tab="tickets">🎫 抢票<span class="cnt" id="ticket-cnt"></span></div>
      <div class="tab" data-act="tab" data-tab="schedule">🧭 智能排期</div>
      <div class="tab" data-act="tab" data-tab="settings">⚙️ 设置</div>
    </nav>
  </div>
</header>
<div id="banner"></div>
<main>
  <section class="view active" id="view-cal"></section>
  <section class="view" id="view-list">
    <div class="filters">
      <input type="text" id="list-q" placeholder="搜索剧名 / 城市 / 场馆…" style="min-width:220px">
      <select id="list-pri">
        <option value="0">全部优先级</option>
        <option value="3">必看</option>
        <option value="2">想看</option>
        <option value="1">可选</option>
      </select>
      <select id="list-ticket">
        <option value="">全部票务状态</option>
        <option value="已购">已购票</option>
        <option value="已抢">已抢到</option>
        <option value="开票">已开票未抢</option>
        <option value="放弃">已放弃</option>
      </select>
      <button class="btn primary" data-act="add-show">＋ 添加剧目</button>
      <span class="muted small" style="margin-left:auto" id="list-count"></span>
    </div>
    <div id="list-cards"></div>
  </section>
  <section class="view" id="view-tickets"></section>
  <section class="view" id="view-schedule"></section>
  <section class="view" id="view-settings"></section>
</main>
<div id="modal-root"></div>
<div id="toast"></div>
<input type="file" id="import-file" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* ================================================================
   🎭 音乐剧排期 & 抢票日历 —— 单文件应用
   功能：剧目/场次管理 · 月历视图 · 撞期与上班时间冲突检测 ·
         抢票倒计时与提醒 · 智能排期(最优解) · iCal 导出 · 数据导入导出
   ================================================================ */

/* ---------------- 工具函数 ---------------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const dateStr = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDaysStr = (s, n) => { const d = parseDate(s); d.setDate(d.getDate()+n); return dateStr(d); };
const daysFromToday = n => { const d = new Date(); d.setDate(d.getDate()+n); return dateStr(d); };
const toMin = t => { const [h,m] = (t||'00:00').split(':').map(Number); return h*60+m; };
const fmtMin = m => `${pad2(Math.floor(m/60))}:${pad2(m%60)}`;
const dtStr = d => `${dateStr(d)}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const nowDT = () => dtStr(new Date());
function parseDT(s){ if(!s) return null; const [d,t]=s.split('T'); const [y,mo,da]=d.split('-').map(Number); const [h,mi]=t.split(':').map(Number); return new Date(y,mo-1,da,h,mi); }
function fmtShortDT(s){ const d=parseDT(s); if(!d) return ''; return `${d.getMonth()+1}月${d.getDate()}日 ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function fmtDTcn(s){ const d=parseDT(s); if(!d) return ''; return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
const WEEK_CN = ['日','一','二','三','四','五','六'];
const weekdayCN = ds => '周'+WEEK_CN[parseDate(ds).getDay()];
const isWeekend = ds => { const d = parseDate(ds).getDay(); return d===0||d===6; };
const weekTag = ds => isWeekend(ds) ? '<span class="tag-wd free">周末</span>' : '<span class="tag-wd work">工作日</span>';
const PRIORITY_LABEL = {3:'必看', 2:'想看', 1:'可选'};
const TICKET_LABEL  = {'':'未处理','已抢':'已抢','已购':'已购','放弃':'放弃'};
function uid(){ return 'id'+Math.random().toString(36).slice(2,9)+Date.now().toString(36); }

/* 场次的绝对分钟（跨日期比较用）；end<=start 视为跨夜 +24h */
function pStart(p){ return Date.parse(p.date+'T'+(p.start||'00:00'))/60000; }
function pEnd(p){
  const s=toMin(p.start), e=toMin(p.end||p.start);
  return Date.parse(p.date+'T'+(p.end||p.start))/60000 + (e<=s?1440:0);
}
function perfOverlap(a,b){ return pStart(a) < pEnd(b) && pStart(b) < pEnd(a); }

/* ---------------- 状态 ---------------- */
const LS_KEY = 'musical-calendar-v1';
let state = null;
function defaultState(){
  return {
    settings: { workHours:{ enabled:true, weekdays:[1,2,3,4,5], start:'09:00', end:'18:00' }, notify:false },
    shows: []
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && Array.isArray(s.shows)) return s; }
  }catch(e){ console.warn('读取本地数据失败', e); }
  return defaultState();
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ console.warn('保存失败', e); } }
state = load();

function allPerfs(){
  const out=[];
  for(const s of state.shows) for(const p of s.performances)
    if(p.date && p.start) out.push({show:s, perf:p});
  return out;
}

/* 上班时间冲突：工作日且演出与上班时段重叠（剧目允许则可豁免） */
function workConflict(p, show){
  if(show.allowWork) return false;
  const w = state.settings.workHours;
  if(!w.enabled) return false;
  const dow = parseDate(p.date).getDay(); // 0 周日 .. 6 周六
  const wd = dow===0 ? 7 : dow;
  if(!w.weekdays.includes(wd)) return false;
  const ps=toMin(p.start), pe=toMin(p.end||p.start), ws=toMin(w.start), we=toMin(w.end);
  return ps < we && pe > ws;
}
function conflictsOf(p, show){
  const res=[];
  for(const s of state.shows) for(const q of s.performances){
    if(q.id===p.id || !q.date || !q.start) continue;
    if(perfOverlap(p,q)) res.push({type:'overlap', name:s.name, q});
  }
  if(workConflict(p, show)) res.push({type:'work'});
  return res;
}
function ticketStateOf(p){
  if(p.ticket) return p.ticket;
  const d = parseDT(p.ticketOpen);
  if(!d) return '未开票';
  return d > new Date() ? '未开票' : '已开票';
}

/* ---------------- 智能排期 ---------------- */
/*
   目标：在“每部剧最多安排一场”前提下，最大化所看剧目的优先级总分，
   且任意两场不重叠、默认避开工作日上班时段（可勾选允许请假）。
   算法：按结束时间排序的动态规划（dp[mask] = 该 mask 的最小“最后结束时间”），
   得到最优解；剧目过多时自动退化为贪心。
*/
function solveSchedule(opts){
  const res = { chosen:[], skipped:[], pinnedWarn:[], ok:true, msg:'', mode:'' };
  const shows = state.shows.filter(s => s.name.trim());
  if(!shows.length){ res.ok=false; res.msg='还没有剧目，先去「剧目」页添加吧'; return res; }

  const pinned = [];
  const cands = shows.map(show => {
    const list=[];
    const locked = opts.lock && show.performances.some(p => p.ticket==='已购' || p.ticket==='已抢');
    if(locked){ // 该剧已有锁定场次：整剧固定
      for(const p of show.performances)
        if((p.ticket==='已购'||p.ticket==='已抢') && p.date && p.start) pinned.push({show, p});
      return list;
    }
    for(const p of show.performances){
      if(!p.date || !p.start) continue;
      if(p.ticket==='放弃') continue;
      if(opts.from && p.date < opts.from) continue;
      if(opts.to && p.date > opts.to) continue;
      if(opts.weekendOnly && !isWeekend(p.date)) continue;
      if(opts.avoidWork && workConflict(p, show)) continue;
      list.push(p);
    }
    return list;
  });

  for(let i=0;i<pinned.length;i++) for(let j=i+1;j<pinned.length;j++)
    if(perfOverlap(pinned[i].p, pinned[j].p))
      res.pinnedWarn.push(`${pinned[i].show.name} ${pinned[i].p.date} 与 ${pinned[j].show.name} ${pinned[j].p.date} 的已锁定场次互相撞期`);

  let lastEnd = 0;
  for(const it of pinned){ const e=pEnd(it.p); if(e>lastEnd) lastEnd=e; }
  cands.forEach(list => {
    for(let i=list.length-1;i>=0;i--)
      if(pinned.some(q => perfOverlap(q.p, list[i]))) list.splice(i,1);
  });

  const N = shows.length;
  if(N <= 18 && opts.mode !== 'greedy'){
    res.mode = N<=18 ? '最优解（DP）' : '贪心';
    /* 收集全部候选并按结束时间排序 */
    const perfs=[];
    for(let si=0; si<N; si++) for(let pi=0; pi<cands[si].length; pi++)
      perfs.push({si, pi, p:cands[si][pi], st:pStart(cands[si][pi]), en:pEnd(cands[si][pi])});
    perfs.sort((a,b)=>a.en-b.en || a.st-b.st);
    const total=1<<N, INF=Infinity;
    const dp=new Array(total).fill(INF); dp[0]=lastEnd;
    const par=new Array(total).fill(null);
    for(const it of perfs){
      const bit=1<<it.si;
      for(let mask=0; mask<total; mask++){
        if(mask & bit) continue;
        const le=dp[mask];
        if(le===INF || le>it.st) continue;
        const nm=mask|bit;
        if(it.en < dp[nm]){ dp[nm]=it.en; par[nm]={prev:mask, si:it.si, pi:it.pi}; }
      }
    }
    let bestMask=0, bestVal=-1;
    for(let mask=0; mask<total; mask++){
      if(dp[mask]===INF) continue;
      let v=0; for(let i=0;i<N;i++) if(mask & (1<<i)) v+=shows[i].priority;
      if(v>bestVal){ bestVal=v; bestMask=mask; }
    }
    const picked = new Array(N).fill(-1);
    let m=bestMask;
    while(m){ const pr=par[m]; if(!pr) break; picked[pr.si]=pr.pi; m=pr.prev; }
    for(let i=0;i<N;i++) if(picked[i]>=0) res.chosen.push({show:shows[i], perf:cands[i][picked[i]]});
  }else{
    res.mode = '贪心（剧目较多时更快）';
    const order = shows.map((s,i)=>({i, pri:s.priority, n:cands[i].length}))
                       .sort((a,b)=> b.pri-a.pri || a.n-b.n);
    const taken = pinned.map(q=>q.p);
    for(const o of order){
      const list=[...cands[o.i]].sort((a,b)=>pStart(a)-pStart(b) || pEnd(a)-pEnd(b));
      let pick=null;
      for(const p of list){ if(!taken.some(q=>perfOverlap(q,p))){ pick=p; break; } }
      if(pick){ taken.push(pick); res.chosen.push({show:shows[o.i], perf:pick}); }
    }
  }
  for(const q of pinned) res.chosen.push({show:q.show, perf:q.p, locked:true});
  res.chosen.sort((a,b)=> pStart(a.perf)-pStart(b.perf) || pEnd(a.perf)-pEnd(b.perf));

  /* 未排入剧目及原因 */
  const chosenShowIds = new Set(res.chosen.map(c=>c.show.id));
  for(let i=0;i<N;i++){
    const s=shows[i];
    if(chosenShowIds.has(s.id)) continue;
    let reason;
    if(!s.performances.length) reason='未排期（还没有场次）';
    else if(!cands[i].length){
      const hasPerfs = s.performances.filter(p=>p.date&&p.start&&p.ticket!=='放弃');
      const allWork = hasPerfs.length>0 && hasPerfs.every(p=>workConflict(p,s));
      if(allWork && !s.allowWork) reason='场次都在工作时间内（可在剧目里勾选「允许占用上班时间」）';
      else if(opts.from||opts.to||opts.weekendOnly) reason='所选日期范围 / 周末过滤后没有可用场次';
      else reason='场次已放弃或与锁定场次冲突';
    }else{
      const blocks=[];
      for(const p of cands[i]){
        const bs=res.chosen.filter(c=>perfOverlap(c.perf,p)).map(c=>`${c.show.name} ${c.perf.date}${c.perf.start}`);
        if(bs.length) blocks.push(`${p.date} ${p.start} ← 被 ${bs.join('、')} 占住`);
      }
      reason = blocks.length ? `全部场次与已安排剧目撞期（如：${blocks.slice(0,2).join('；')}）`
                             : '没有不与已安排剧目撞期的场次';
    }
    res.skipped.push({show:s, reason});
  }
  res.totalPriority = res.chosen.reduce((a,c)=>a+(c.show.priority||0), 0);
  return res;
}

/* 全局冲突总览（所有已录入场次之间） */
function globalConflicts(){
  const ps=allPerfs(), out=[];
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++)
    if(perfOverlap(ps[i].perf, ps[j].perf)) out.push({type:'overlap', a:ps[i], b:ps[j]});
  for(const it of ps) if(workConflict(it.perf, it.show)) out.push({type:'work', a:it});
  return out;
}

let calY=new Date().getFullYear(), calM=new Date().getMonth()+1;
let calFilter=0; // 0全部 3必看 2必看+想看 1全部
function calShows(){
  if(!calFilter) return state.shows;
  return state.shows.filter(s=>s.priority>=calFilter);
}
function renderCalendar(){
  const perfsOfDay = d => {
    const out=[];
    for(const s of calShows()) for(const p of s.performances)
      if(p.date===d && p.start) out.push({show:s, perf:p});
    out.sort((a,b)=>toMin(a.perf.start)-toMin(b.perf.start));
    return out;
  };
  const today = dateStr(new Date());
  const daysInMonth = new Date(calY, calM, 0).getDate();
  const firstDow = parseDate(`${calY}-${pad2(calM)}-01`).getDay();
  const offset = (firstDow + 6) % 7; // 周一起始
  let html = '';
  html += `<div class="cal-head">
      <div class="cal-title">${calY}年${calM}月</div>
      <button class="btn sm" data-act="cal-prev">‹ 上月</button>
      <button class="btn sm" data-act="cal-today">今天</button>
      <button class="btn sm" data-act="cal-next">下月 ›</button>
      <select style="margin-left:auto" data-act="cal-filter" title="按优先级过滤日历">

        <option value="3" ${calFilter===3?'selected':''}>仅必看</option>
        <option value="2" ${calFilter===2?'selected':''}>必看 + 想看</option>
      </select>
    </div>`;
  const monthPerfs = allPerfs().filter(x=>x.perf.date.slice(0,7)===`${calY}-${pad2(calM)}`);
  let overlapCnt=0, workCnt=0;
  const mps = monthPerfs;
  for(let i=0;i<mps.length;i++) for(let j=i+1;j<mps.length;j++)
    if(perfOverlap(mps[i].perf, mps[j].perf)) overlapCnt++;
  for(const it of mps) if(workConflict(it.perf, it.show)) workCnt++;
  html += `<div class="cal-stats">本月 ${monthPerfs.length} 场演出 · 撞期 ${overlapCnt} 组 · 与上班时间冲突 ${workCnt} 场</div>`;
  html += '<div class="cal-grid"><div class="dow">一</div><div class="dow">二</div><div class="dow">三</div><div class="dow">四</div><div class="dow">五</div><div class="dow weekend">六</div><div class="dow weekend">日</div>';
  for(let i=0;i<offset;i++) html += '<div class="day-cell other"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const d = `${calY}-${pad2(calM)}-${pad2(day)}`;
    const list = perfsOfDay(d);
    const isToday = d===today;
    const hasTicket = list.some(x=>x.perf.ticketOpen && x.perf.ticketOpen.slice(0,10)===d);
    let cell = `<div class="day-cell${isToday?' today':''}" data-act="open-day" data-date="${d}">
      <div class="day-num">${day}${hasTicket?' 🎫':''}</div>`;
    list.slice(0,4).forEach(({show,perf})=>{
      const conf = conflictsOf(perf,show).length>0;
      const bought = perf.ticket==='已购'||perf.ticket==='已抢';
      cell += `<div class="chip pri-${show.priority}${conf?' warn':''}${bought?' bought':''}">
        <span class="t">${esc(show.name)}</span><span class="ct">${perf.start}</span></div>`;
    });
    if(list.length>4) cell += `<div class="more">+${list.length-4} 场</div>`;
    cell += '</div>';
    html += cell;
  }
  html += '</div>';
  /* 今日演出快速条 */
  const todayList = perfsOfDay(today);
  let strip = `<div class="today-strip"><span class="lb">今日</span>`;
  if(todayList.length){
    todayList.forEach(({show,perf})=>{
      strip += `<span class="chip pri-${show.priority}">${esc(show.name)} <span class="ct">${perf.start}-${perf.end||'?'}</span></span>`;
    });
  }else{
    strip += '<span class="muted small">今日无演出安排</span>';
  }
  strip += '</div>';
  $('#view-cal').innerHTML = strip + html;
}

/* ================= 抢票时间线 ================= */
let tickMap = {};   // key -> {open(Date), el, show, perf}
let notified = new Set();
let beeped = new Set();
function ticketKey(s,p){ return s.id+'::'+p.id; }
function renderTickets(){
  tickMap = {};
  const items=[];
  for(const s of state.shows) for(const p of s.performances){
    if(!p.ticketOpen) continue;
    const d = parseDT(p.ticketOpen);
    if(!d) continue;
    items.push({show:s, perf:p, open:d, past: d<=new Date()});
  }
  items.sort((a,b)=>a.open-b.open);
  let html='';
  const openSoon = items.filter(x=>!x.past && x.open.getTime()-Date.now()<=5*60000 && !x.perf.ticket);
  const cnt = items.filter(x=>!x.past).length;
  $('#ticket-cnt').textContent = cnt?`(${cnt})`:'';
  if(!items.length){
    html = `<div class="card empty"><div class="big">🎫</div><p>还没有录入开票时间。在「剧目」页为场次填写「开票时间」后，这里会显示倒计时。</p></div>`;
    $('#view-tickets').innerHTML = html; return;
  }
  html += `<div class="muted small" style="margin-bottom:12px">共 ${items.length} 个开票节点，${items.filter(x=>!x.past).length} 个待抢${openSoon.length?` · <span style="color:var(--warn)">${openSoon.length} 个将在 5 分钟内开票！</span>`:''}</div>`;
  for(const it of items){
    const key = ticketKey(it.show,it.perf);
    const rem = it.open.getTime()-Date.now();
    const hot = !it.past && rem<=5*60000;
    const tst = it.perf.ticket;
    html += `<div class="tick-row${hot?' open-soon':''}${it.past?' past':''}">
      <div class="tick-count${hot?' hot':''}${!it.past&&rem<=0?' zero':''}" data-tkey="${key}">--</div>
      <div class="tick-info">
        <div class="t1">🎫 ${esc(it.show.name)} <span class="dim small">${esc(it.perf.date)} ${esc(it.perf.start)}场</span></div>
        <div class="t2">开票：${fmtDTcn(it.perf.ticketOpen)} · ${esc(it.perf.venue||'')}${it.perf.date?(' · '+weekdayCN(it.perf.date)):''}</div>
      </div>
      <select data-act="set-ticket" data-show="${it.show.id}" data-perf="${it.perf.id}">
        ${Object.keys(TICKET_LABEL).map(k=>`<option value="${k}" ${it.perf.ticket===k?'selected':''}>${TICKET_LABEL[k]}</option>`).join('')}
      </select>
    </div>`;
    if(!it.past) tickMap[key] = {open:it.open, show:it.show, perf:it.perf};
  }
  $('#view-tickets').innerHTML = html;
  updateTicker();
}

function fmtCountdown(ms){
  if(ms<=0) return '已开票！';
  const s=Math.floor(ms/1000);
  const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(d>0) return `${d}天 ${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
  return `${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
}
function updateTicker(){
  const now=Date.now();
  for(const key in tickMap){
    const it=tickMap[key];
    const el=document.querySelector(`[data-tkey="${key}"]`);
    if(!el) continue;
    const rem=it.open.getTime()-now;
    el.textContent=fmtCountdown(rem);
    if(rem<=0 && !el.classList.contains('zero')) el.classList.add('zero');
    /* 5 分钟内提醒（浏览器通知） */
    if(rem>0 && rem<=5*60000 && !notified.has(key) && state.settings.notify && Notification.permission==='granted'){
      notified.add(key);
      try{ new Notification('🎫 即将开票：'+it.show.name, {body:`${it.perf.date} ${it.perf.start} 场 · ${fmtShortDT(it.perf.ticketOpen)} 开票，记得抢票！`}); }catch(e){}
    }
    /* 开票瞬间提示音 */
    if(rem<=0 && !beeped.has(key) && state.settings.notify){
      beeped.add(key);
      try{ beep(); }catch(e){}
    }
  }
  updateBanner(now);
}
function updateBanner(now){
  const b=$('#banner');
  const soon=[];
  for(const key in tickMap){
    const it=tickMap[key], rem=it.open.getTime()-now;
    if(rem>0 && rem<=10*60000 && !it.perf.ticket) soon.push({rem, show:it.show, perf:it.perf});
  }
  soon.sort((a,b)=>a.rem-b.rem);
  if(soon.length){
    const it=soon[0];
    b.style.display='block';
    b.innerHTML = `🎫 <b>${esc(it.show.name)}</b> ${esc(it.perf.date)} ${esc(it.perf.start)}场 将在 <b>${fmtCountdown(it.rem)}</b> 后开票，快准备！`;
    b.onclick = ()=>{ switchTab('tickets'); };
  }else{
    b.style.display='none';
  }
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=880; g.gain.value=.06;
    o.start(); o.stop(ctx.currentTime+.35);
    o.onended=()=>ctx.close();
  }catch(e){}
}

        }

      }
    }
    if(r.skipped.length){
      html += `<h4 class="sub-title">😢 未能安排（${r.skipped.length}）</h4>`;
      for(const s of r.skipped)
        html += `<div class="skip-item">${esc(s.show.name)} <span class="pill p${s.show.priority}">${PRIORITY_LABEL[s.show.priority]}</span> <span class="why">— ${esc(s.reason)}</span></div>`;

function download(name, content, type){
  const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function icsEsc(s){ return String(s??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function buildICS(includeTickets){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MusicalCalendar//CN//EN','CALSCALE:GREGORIAN'];
  const vdt=s=>s.replace(/-/g,'').replace('T','T').replace(':','');
  for(const {show,perf} of allPerfs()){
    const start=perf.date.replace(/-/g,'')+'T'+perf.start.replace(':','')+'00';
    const end=(perf.date.replace(/-/g,''))+'T'+(perf.end||perf.start).replace(':','')+'00';
    L.push('BEGIN:VEVENT','UID:'+uid()+'@musical-cal',
      'DTSTART:'+start,'DTEND:'+end,
      'SUMMARY:'+icsEsc(`${show.name} ${perf.start}场`),
      'LOCATION:'+icsEsc(perf.venue||''),
      'DESCRIPTION:'+icsEsc(`优先级:${PRIORITY_LABEL[show.priority]}${show.city?(' 城市:'+show.city):''}${perf.note?(' 备注:'+perf.note):''}`),
      'END:VEVENT');
    if(includeTickets && perf.ticketOpen && parseDT(perf.ticketOpen)){
      const ts=vdt(perf.ticketOpen)+'00';
      const te=vdt(perf.ticketOpen)+'30';
      L.push('BEGIN:VEVENT','UID:'+uid()+'@musical-cal',
        'DTSTART:'+ts,'DTEND:'+te,
        'SUMMARY:'+icsEsc('🎫开票：'+show.name),
        'DESCRIPTION:'+icsEsc(`${perf.date} ${perf.start} ${perf.venue||''} 记得抢票！`),
        'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('5分钟后开票：'+show.name),'TRIGGER:-PT5M','END:VALARM',
        'END:VEVENT');
    }
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

function importJSON(file){

    }catch(e){ showToast('导入失败：不是有效的备份文件'); }
  };
  reader.readAsText(file);
}

function nextWeekdayStr(wd, minDays){
  const d=new Date(); d.setDate(d.getDate()+minDays);
  const cur=d.getDay()===0?7:d.getDay();
  let diff=wd-cur; if(diff<=0) diff+=7;
  d.setDate(d.getDate()+diff);
  return dateStr(d);
}

/* ================= 路由 & 事件 ================= */
let currentTab='cal';
function switchTab(name){
  currentTab=name;
  $$('#tabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  $$('section.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+name));
}
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;
  switch(act){
    case 'tab': switchTab(el.dataset.tab); break;
    case 'cal-prev': calM--; if(calM<1){calM=12;calY--;} renderCalendar(); break;
    case 'cal-next': calM++; if(calM>12){calM=1;calY++;} renderCalendar(); break;
    case 'cal-today': calY=new Date().getFullYear(); calM=new Date().getMonth()+1; renderCalendar(); break;
    case 'open-day': openDayModal(el.dataset.date); break;
    case 'close-modal': closeModal(); modalInfo=null; break;
    case 'add-show': openShowModal(null); break;
    case 'edit-show': openShowModal(el.dataset.id); break;
    case 'del-show':
      if(confirm('确定删除这部剧及其所有场次？')){
        state.shows=state.shows.filter(s=>s.id!==el.dataset.id);
        save(); renderAll(); showToast('已删除');
      }
      break;
    case 'add-perf': openPerfModal(el.dataset.show, null); break;
    case 'edit-perf': openPerfModal(el.dataset.show, el.dataset.perf); break;
    case 'del-perf':
      {
        const s=state.shows.find(x=>x.id===el.dataset.show);
        if(s && confirm('确定删除该场次？')){
          s.performances=s.performances.filter(p=>p.id!==el.dataset.perf);
          save(); renderAll(); refreshModal(); showToast('已删除场次');
        }
      }
      break;
    case 'run-schedule':
      lastSchedule=solveSchedule({
        avoidWork:$('#opt-work').checked,
        lock:$('#opt-lock').checked,
        weekendOnly:$('#opt-weekend').checked,
        from:$('#opt-from').value||null,
        to:$('#opt-to').value||null,
        mode:$('#opt-mode').value==='greedy'?'greedy':'auto'
      });
      renderSchedule();
      switchTab('schedule');
      if(lastSchedule.ok) showToast(`排期完成：可看 ${lastSchedule.chosen.length} 部剧目`);
      else showToast(lastSchedule.msg);
      break;
    case 'export-json': exportJSON(); break;
    case 'import-json': $('#import-file').click(); break;
    case 'export-ics': download('musical-performances.ics', buildICS(false), 'text/calendar'); showToast('已导出演出日历 iCal'); break;
    case 'export-ics-tickets': download('musical-tickets.ics', buildICS(true), 'text/calendar'); showToast('已导出抢票提醒 iCal'); break;
    case 'load-demo':
      if(confirm('载入示例数据会追加 8 部示例剧目（不清空现有数据），继续？')) loadDemo();
      break;
    case 'reset-data':
      if(confirm('确定清空全部数据？建议先导出备份！')){
        state=defaultState(); save(); lastSchedule=null; renderAll(); showToast('已清空');
      }
      break;
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='list-q'){ listFilter.q=e.target.value; renderList(); }
});
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.dataset.act==='set-ticket'){
    const s=state.shows.find(x=>x.id===el.dataset.show);
    const p=s && s.performances.find(x=>x.id===el.dataset.perf);
    if(p){ p.ticket=el.value; save(); refreshModal(); renderAll(); }
  }else if(el.dataset.act==='set-priority'){
    const s=state.shows.find(x=>x.id===el.dataset.id);
    if(s){ s.priority=+el.value; save(); renderAll(); }
  }else if(el.dataset.act==='set-allowwork'){
    const s=state.shows.find(x=>x.id===el.dataset.id);
    if(s){ s.allowWork=el.checked; save(); renderAll(); }
  }else if(el.dataset.act==='cal-filter'){
    calFilter=+el.value; renderCalendar();
  }else if(el.id==='list-q'){
    listFilter.q=el.value; renderList();
  }else if(el.id==='list-pri'){
    listFilter.pri=+el.value; renderList();
  }else if(el.id==='list-ticket'){
    listFilter.ticket=el.value; renderList();
  }else if(el.id==='notify-toggle'){
    state.settings.notify=el.checked; save();
    if(el.checked && 'Notification' in window && Notification.permission==='default'){
      Notification.requestPermission().then(perm=>{
        showToast(perm==='granted'?'通知已开启':'未获得通知权限，可在浏览器设置中允许');
      });
    }else{
      showToast(state.settings.notify?'开票提醒已开启（需保持页面打开）':'已关闭提醒');
    }
  }else if(el.closest('#wh-days')){
    const on=[...document.querySelectorAll('#wh-days input:checked')].map(i=>+i.value);
    state.settings.workHours.weekdays=on;
    el.closest('label').classList.toggle('on', el.checked);
    save(); renderAll();
  }
});
document.addEventListener('submit', e=>{
  if(e.target.id==='work-form'){
    e.preventDefault();
    const w=state.settings.workHours;
    w.enabled=$('#wh-enabled').checked;
    w.start=$('#wh-start').value||'09:00';
    w.end=$('#wh-end').value||'18:00';
    save(); renderAll(); showToast('上班时间已保存');
  }
});
$('#import-file').addEventListener('change', e=>{
  if(e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
  e.target.value='';
});

/* ---------------- 启动 ---------------- */
function renderAll(){
  renderCalendar(); renderList(); renderTickets(); renderSchedule(); renderSettings();
}
renderAll();
setInterval(updateTicker, 1000);
</script>
</body>
</html>
