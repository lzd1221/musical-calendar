<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 音乐剧排期 & 抢票日历</title>
<style>
  :root{
    --bg:#12101e; --panel:#1b1730; --panel2:#221d3d; --border:#332c55;
    --text:#ece9f7; --muted:#a49fc4; --dim:#6f6a92;
    --accent:#f2b24c; --ok:#51cf66; --danger:#ff6b6b; --warn:#ffd43b; --info:#6c9eff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--bg),#0e0c18);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
  .hidden{display:none!important}

  /* 登录/注册 */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .auth-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px 28px;width:340px}
  .auth-box h1{font-size:20px;text-align:center;margin-bottom:4px}
  .auth-box .sub{color:var(--dim);font-size:12.5px;text-align:center;margin-bottom:20px}
  .auth-tabs{display:flex;gap:8px;margin-bottom:20px}
  .auth-tabs .tab{flex:1;text-align:center;padding:9px;border-radius:10px;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:14px}
  .auth-tabs .tab.on{background:rgba(242,178,76,.15);border-color:var(--accent);color:var(--accent);font-weight:600}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:56px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:14px;width:100%}
  .btn.primary{background:var(--accent);color:#1a1428;font-weight:600;border-color:var(--accent)}
  .btn.sm{width:auto;padding:5px 12px;font-size:12.5px;border-radius:8px}
  .btn.danger{color:var(--danger);border-color:rgba(255,107,107,.4)}
  .err{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:8px;text-align:center}

  /* 主界面 */
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .topbar h1{font-size:20px}
  .topbar .user{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card h2 .hint{font-size:12px;color:var(--dim);font-weight:400}
  .muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12px}

  /* 日历 */
  .cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .cal-title{font-size:18px;font-weight:700;min-width:130px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dow{text-align:center;color:var(--dim);font-size:11px;padding:4px 0}
  .cell{background:var(--panel2);border:1px solid var(--border);border-radius:10px;min-height:84px;padding:6px;cursor:pointer}
  .cell:hover{border-color:var(--accent)}
  .cell.today{border-color:var(--accent)}
  .cell.other{opacity:.3}
  .day-num{font-size:12px;color:var(--muted)}
  .cell.today .day-num{color:var(--accent);font-weight:700}
  .mark{font-size:11px;padding:1px 5px;border-radius:5px;margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .mark.ticket{background:rgba(255,107,107,.16);color:#ffb3b3}
  .mark.show{background:rgba(242,178,76,.16);color:#ffd98a}

  /* 待抢票 + 列表 */
  .item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px dashed var(--border);flex-wrap:wrap}
  .item:last-child{border-bottom:none}
  .item .nm{font-weight:600}
  .item .meta{font-size:12.5px;color:var(--muted)}
  .countdown{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
  .countdown.hot{color:var(--danger)}
  .status{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:transparent}
  .status.on{color:var(--ok);border-color:rgba(81,207,102,.5)}
  .status.got{color:var(--info);border-color:rgba(108,158,255,.5)}
  .status.drop{color:var(--danger);border-color:rgba(255,107,107,.4)}
  .empty{text-align:center;color:var(--dim);padding:24px 10px}

  /* 弹层 */
  .overlay{position:fixed;inset:0;background:rgba(6,5,12,.75);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:100%;max-width:460px;padding:22px;max-height:88vh;overflow:auto}
  .modal h3{font-size:17px;margin-bottom:16px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .form-grid .full{grid-column:1/-1}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .modal .actions .btn{width:auto}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- 登录/注册 -->
<div id="authView" class="auth-wrap hidden">
  <div class="auth-box">
    <h1>🎭 音乐剧排期 & 抢票日历</h1>
    <div class="sub">注册账户，管理你自己的看剧与抢票计划</div>
    <div class="auth-tabs">
      <div class="tab on" data-mode="login" id="tabLogin">登录</div>
      <div class="tab" data-mode="register" id="tabRegister">注册</div>
    </div>
    <div id="loginForm">
      <div class="field"><label>用户名</label><input type="text" id="loginUser" placeholder="用户名" autocomplete="username"></div>
      <div class="field"><label>密码</label><input type="password" id="loginPass" placeholder="密码" autocomplete="current-password"></div>
      <button class="btn primary" id="btnLogin">登 录</button>
    </div>
    <div id="registerForm" class="hidden">
      <div class="field"><label>用户名（2-20 位）</label><input type="text" id="regUser" placeholder="字母/数字/中文" autocomplete="username"></div>
      <div class="field"><label>密码（至少 6 位）</label><input type="password" id="regPass" placeholder="密码" autocomplete="new-password"></div>
      <div class="field"><label>确认密码</label><input type="password" id="regPass2" placeholder="再输一次" autocomplete="new-password"></div>
      <button class="btn primary" id="btnRegister">注册并进入</button>
    </div>
    <div class="err" id="authErr"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="appView" class="wrap hidden">
  <div class="topbar">
    <h1>🎭 我的日历</h1>
    <span class="user" id="welcomeUser"></span>
    <div class="spacer"></div>
    <button class="btn sm primary" id="btnAdd">＋ 添加计划</button>
    <button class="btn sm" id="btnLogout">退出</button>
  </div>

  <!-- 月历 -->
  <div class="card">
    <div class="cal-head">
      <div class="cal-title" id="calTitle"></div>
      <button class="btn sm" id="calPrev">‹ 上月</button>
      <button class="btn sm" id="calToday">今天</button>
      <button class="btn sm" id="calNext">下月 ›</button>
      <div class="spacer"></div>
      <span class="small dim">🎫 抢票 · 🎭 看剧</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- 待抢票 -->
  <div class="card">
    <h2>🎫 待抢票 <span class="hint">按时间排序，开票前 30 分钟内变红</span></h2>
    <div id="upcoming"></div>
  </div>

  <!-- 我的计划 -->
  <div class="card">
    <h2>📋 我的计划 <span class="hint">点击状态切换：待抢 / 已抢 / 已购 / 放弃</span></h2>
    <div id="planList"></div>
  </div>
</div>

<!-- 添加计划弹层 -->
<div class="overlay hidden" id="addOverlay">
  <div class="modal">
    <h3>＋ 添加计划</h3>
    <div class="form-grid">
      <div class="field full"><label>剧名 *</label><input type="text" id="f-name" placeholder="如：剧院魅影"></div>
      <div class="field"><label>城市</label><input type="text" id="f-city" placeholder="上海"></div>
      <div class="field"><label>抢票时间（开票）</label><input type="datetime-local" id="f-open"></div>
      <div class="field"><label>演出日期</label><input type="date" id="f-date"></div>
      <div class="field"><label>演出时间</label><input type="time" id="f-time"></div>
      <div class="field"><label>场馆</label><input type="text" id="f-venue" placeholder="如：上海文化广场"></div>
      <div class="field full"><label>备注</label><input type="text" id="f-note" placeholder="如：某卡司 / 末场"></div>
    </div>
    <div class="actions">
      <button class="btn" id="btnCancel">取消</button>
      <button class="btn primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const ESC = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const dateStr = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const fmtDT = ts => { const d = new Date(ts); return (d.getMonth()+1)+'月'+d.getDate()+'日 '+pad2(d.getHours())+':'+pad2(d.getMinutes()); };
const fmtCn = ds => { const p = (ds||'').split('-'); return p.length===3 ? (+p[1])+'月'+(+p[2])+'日' : (ds||''); };

async function api(path, method, body) {
  const opt = { method: method || 'GET', headers: {} };
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({}));
  return { status: r.status, data };
}

let ME = null;
let plans = [];
let calOffset = 0; // 相对当前月的偏移

/* ---------- 登录/注册 ---------- */
function switchAuth(mode) {
  $('#tabLogin').classList.toggle('on', mode === 'login');
  $('#tabRegister').classList.toggle('on', mode === 'register');
  $('#loginForm').classList.toggle('hidden', mode !== 'login');
  $('#registerForm').classList.toggle('hidden', mode !== 'register');
  $('#authErr').textContent = '';
}
$('#tabLogin').onclick = () => switchAuth('login');
$('#tabRegister').onclick = () => switchAuth('register');
$('#btnLogin').onclick = async () => {
  const r = await api('/api/login', 'POST', { username: $('#loginUser').value.trim(), password: $('#loginPass').value });
  if (r.status === 200) { location.reload(); } else { $('#authErr').textContent = r.data.msg || '登录失败'; }
};
$('#btnRegister').onclick = async () => {
  const u = $('#regUser').value.trim(), p = $('#regPass').value, p2 = $('#regPass2').value;
  if (p !== p2) { $('#authErr').textContent = '两次密码不一致'; return; }
  const r = await api('/api/register', 'POST', { username: u, password: p });
  if (r.status === 200) { location.reload(); } else { $('#authErr').textContent = r.data.msg || '注册失败'; }
};
['loginPass','regPass'].forEach(id => $(('#'+id)).addEventListener('keydown', e => { if (e.key==='Enter') (id==='loginPass'?$('#btnLogin'):$('#btnRegister')).click(); }));

/* ---------- 主界面 ---------- */
async function loadPlans() {
  const r = await api('/api/plans');
  if (r.status === 200) { plans = r.data.list || []; }
  render();
}
function render() {
  renderCalendar();
  renderUpcoming();
  renderList();
}
function renderCalendar() {
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
  const y = base.getFullYear(), m = base.getMonth() + 1;
  const daysInMonth = new Date(y, m, 0).getDate();
  const offset = (base.getDay() + 6) % 7;
  const today = dateStr(new Date());
  $('#calTitle').textContent = y + '年' + m + '月';

  const byDate = {};
  for (const p of plans) {
    // 抢票日
    if (p.ticketOpenAt) {
      const d = dateStr(new Date(p.ticketOpenAt));
      (byDate[d] = byDate[d] || []).push({ type: 'ticket', p });
    }
    // 演出日
    if (p.perfDate) {
      (byDate[p.perfDate] = byDate[p.perfDate] || []).push({ type: 'show', p });
    }
  }
  let html = '<div class="dow">一</div><div class="dow">二</div><div class="dow">三</div><div class="dow">四</div><div class="dow">五</div><div class="dow">六</div><div class="dow">日</div>';
  for (let i = 0; i < offset; i++) html += '<div class="cell other"></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const d = y + '-' + pad2(m) + '-' + pad2(day);
    const items = byDate[d] || [];
    let marks = '';
    for (const it of items.slice(0, 3)) {
      marks += '<div class="mark ' + (it.type === 'ticket' ? 'ticket' : 'show') + '">' + (it.type === 'ticket' ? '🎫' : '🎭') + ESC(it.p.showName) + '</div>';
    }
    if (items.length > 3) marks += '<div class="mark dim">+' + (items.length - 3) + '</div>';
    html += '<div class="cell' + (d === today ? ' today' : '') + '" data-date="' + d + '">' +
      '<div class="day-num">' + day + '</div>' + marks + '</div>';
  }
  $('#calGrid').innerHTML = html;
}
function renderUpcoming() {
  const now = Date.now();
  const upcoming = plans.filter(p => p.ticketStatus === '待抢' && p.ticketOpenAt && p.ticketOpenAt > now)
    .sort((a, b) => a.ticketOpenAt - b.ticketOpenAt);
  if (!upcoming.length) { $('#upcoming').innerHTML = '<div class="empty">暂无待抢票计划，点「＋ 添加计划」开始</div>'; return; }
  $('#upcoming').innerHTML = upcoming.map(p => {
    const ms = p.ticketOpenAt - now;
    const hot = ms <= 30 * 60000;
    const cd = ms > 0 ? countdownText(ms) : '已开票';
    return '<div class="item"><div style="flex:1;min-width:180px"><div class="nm">' + ESC(p.showName) + '</div>' +
      '<div class="meta">' + fmtDT(p.ticketOpenAt) + (p.venue ? ' · ' + ESC(p.venue) : '') + '</div></div>' +
      '<span class="countdown' + (hot ? ' hot' : '') + '">' + cd + '</span>' +
      '<button class="btn sm" data-act="got" data-id="' + p.id + '">已抢</button></div>';
  }).join('');
  setTimeout(renderUpcoming, 1000);
}
function countdownText(ms) {
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return d > 0 ? d + '天 ' + pad2(h) + ':' + pad2(m) + ':' + pad2(sec) : pad2(h) + ':' + pad2(m) + ':' + pad2(sec);
}
function renderList() {
  const list = [...plans].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if (!list.length) { $('#planList').innerHTML = '<div class="empty">还没有计划</div>'; return; }
  const statusMap = { '待抢': 'status', '已抢': 'status got', '已购': 'status got', '放弃': 'status drop' };
  $('#planList').innerHTML = list.map(p => {
    const open = p.ticketOpenAt ? ('🎫 ' + fmtDT(p.ticketOpenAt)) : '🎫 未设抢票时间';
    const perf = p.perfDate ? ('🎭 ' + fmtCn(p.perfDate) + (p.perfStart ? ' ' + p.perfStart : '')) : '';
    return '<div class="item"><div style="flex:1;min-width:200px"><div class="nm">' + ESC(p.showName) +
      (p.city ? ' <span class="dim small">' + ESC(p.city) + '</span>' : '') + '</div>' +
      '<div class="meta">' + open + (perf ? ' · ' + perf : '') + (p.venue ? ' · 📍' + ESC(p.venue) : '') + (p.note ? ' · ' + ESC(p.note) : '') + '</div></div>' +
      ['待抢','已抢','已购','放弃'].map(s => '<button class="btn sm ' + statusMap[s] + (p.ticketStatus === s ? ' on' : '') + '" data-act="status" data-id="' + p.id + '" data-s="' + s + '">' + s + '</button>').join('') +
      '<button class="btn sm danger" data-act="del" data-id="' + p.id + '">删</button></div>';
  }).join('');
}

/* ---------- 添加计划 ---------- */
$('#btnAdd').onclick = () => { $('#addOverlay').classList.remove('hidden'); $('#f-name').focus(); };
$('#btnCancel').onclick = () => $('#addOverlay').classList.add('hidden');
$('#addOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) $('#addOverlay').classList.add('hidden'); });
$('#btnSave').onclick = async () => {
  const showName = $('#f-name').value.trim();
  if (!showName) { alert('请填写剧名'); return; }
  const body = {
    showName, city: $('#f-city').value.trim(),
    ticketOpenText: $('#f-open').value, perfDate: $('#f-date').value, perfStart: $('#f-time').value,
    venue: $('#f-venue').value.trim(), note: $('#f-note').value.trim()
  };
  const r = await api('/api/plans', 'POST', body);
  if (r.status === 200) {
    $('#addOverlay').classList.add('hidden');
    $('#f-name').value = ''; $('#f-open').value = ''; $('#f-date').value = ''; $('#f-time').value = ''; $('#f-venue').value = ''; $('#f-note').value = '';
    await loadPlans();
  } else { alert(r.data.msg || '保存失败'); }
};

/* ---------- 事件委托 ---------- */
$('#planList').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === 'del') {
    if (!confirm('删除该计划？')) return;
    await api('/api/plans/' + id, 'DELETE'); await loadPlans();
  } else if (b.dataset.act === 'status') {
    await api('/api/plans/' + id, 'PATCH', { ticketStatus: b.dataset.s }); await loadPlans();
  }
});
$('#upcoming').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'got') { await api('/api/plans/' + b.dataset.id, 'PATCH', { ticketStatus: '已抢' }); await loadPlans(); }
});
$('#calPrev').onclick = () => { calOffset--; renderCalendar(); };
$('#calNext').onclick = () => { calOffset++; renderCalendar(); };
$('#calToday').onclick = () => { calOffset = 0; renderCalendar(); };
$('#btnLogout').onclick = async () => { await api('/api/logout', 'POST'); location.reload(); };

/* ---------- 启动 ---------- */
(async function init() {
  const r = await api('/api/auth-status');
  if (r.data.ok) {
    ME = r.data.username;
    $('#welcomeUser').textContent = '你好，' + ME;
    $('#authView').classList.add('hidden');
    $('#appView').classList.remove('hidden');
    await loadPlans();
  } else {
    $('#authView').classList.remove('hidden');
    $('#appView').classList.add('hidden');
  }
})();
</script>
</body>
</html>
